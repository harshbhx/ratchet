<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="wir-t wir-d" font-family="'Inter', system-ui, sans-serif">
  <title id="wir-t">Where everything runs</title>
  <desc id="wir-d">Where each part of Ratchet runs. Real today: development and tests on the owner's laptop in mock mode with no GPU; the adapters were trained on a borrowed GPU; the public live demo and the simulation demo run on Cloudflare Workers with Containers, CPU only, and the live demo has no student endpoint, so the teacher answers every call; the teacher, Nemotron 3 Ultra, runs on Nebius Token Factory. Designed for Nebius AI Cloud, scripted and tested offline and ready to run: a CPU virtual machine for the gateway, ledger and Caddy, a serverless endpoint for the student with vLLM and a LoRA adapter, a serverless job for Night School training, and an object storage bucket. One command, make nebius-plan, prints every step.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" class="mk" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" class="mkb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
