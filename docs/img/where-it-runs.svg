  <rect class="bg" width="1600" height="900"/>
  <text x="64" y="76" class="mo bi" font-size="16" letter-spacing="2.5">WHERE EVERYTHING RUNS</text>
  <text x="64" y="128" class="t h" font-size="40" letter-spacing="-0.8">What runs today, and what is built but not run live.</text>
  <rect class="grp" x="64" y="176" width="320" height="378" rx="24"/>
  <text x="88" y="208" class="mo m" font-size="14" letter-spacing="1.5">YOUR LAPTOP · REAL</text>
  <rect class="card" x="84" y="224" width="280" height="150" rx="16"/>
  <text x="104" y="258" class="t h" font-size="21">Development</text>
  <rect class="pill" x="284" y="238" width="64" height="28" rx="14"/>
  <text x="316.0" y="257" class="pillT mo" font-size="14" text-anchor="middle" letter-spacing="1.5" fill="#fff">CPU</text>
  <text x="104" y="286" class="mo bi" font-size="15">mock mode</text>
  <text x="104" y="312" class="t2" font-size="16">Scripted models, no keys,</text>
  <text x="104" y="334" class="t2" font-size="16">no GPU.</text>
  <text x="104" y="356" class="t2" font-size="16">Open localhost:8000.</text>
  <rect class="card" x="84" y="390" width="280" height="140" rx="16"/>
  <text x="104" y="424" class="t h" font-size="21">Tests and CI</text>
  <rect class="pill" x="284" y="404" width="64" height="28" rx="14"/>
  <text x="316.0" y="423" class="pillT mo" font-size="14" text-anchor="middle" letter-spacing="1.5" fill="#fff">CPU</text>
  <text x="104" y="452" class="t2" font-size="16">pytest, lint, reference runs.</text>
  <text x="104" y="474" class="t2" font-size="16">No network, no GPU.</text>
  <text x="104" y="496" class="t2" font-size="16">Same checks on GitHub.</text>
  <rect class="grp" x="64" y="578" width="320" height="212" rx="24"/>
  <text x="88" y="610" class="mo m" font-size="14" letter-spacing="1.5">BORROWED GPU · REAL</text>
  <rect class="card" x="84" y="626" width="280" height="140" rx="16"/>
  <text x="104" y="660" class="t h" font-size="21">Adapter training</text>
  <rect class="pillG" x="284" y="640" width="64" height="28" rx="14"/>
  <text x="316.0" y="659" class="pillT mo" font-size="14" text-anchor="middle" letter-spacing="1.5" fill="#fff">GPU</text>
  <text x="104" y="688" class="t2" font-size="16">The original adapters: LoRA</text>
  <text x="104" y="710" class="t2" font-size="16">trained on a borrowed GPU.</text>
  <text x="104" y="732" class="t2" font-size="16">Nothing is served from it.</text>
  <rect class="grp" x="424" y="176" width="372" height="376" rx="24"/>
  <text x="448" y="208" class="mo m" font-size="14" letter-spacing="1.5">CLOUDFLARE · REAL, CPU ONLY</text>
  <rect class="card" x="444" y="224" width="332" height="176" rx="16"/>
  <text x="464" y="258" class="t h" font-size="21">Live gateway</text>
  <rect class="pill" x="696" y="238" width="64" height="28" rx="14"/>
  <text x="728.0" y="257" class="pillT mo" font-size="14" text-anchor="middle" letter-spacing="1.5" fill="#fff">CPU</text>
  <text x="464" y="286" class="mo bi" font-size="15">live.ratchet.dualmindlab.tech</text>
  <text x="464" y="312" class="t2" font-size="16">Workers + Containers.</text>
  <text x="464" y="334" class="t2" font-size="16">Gateway, dashboard, Scout.</text>
  <text x="464" y="356" class="t2" font-size="16">No student endpoint: the</text>
  <text x="464" y="378" class="t2" font-size="16">teacher answers every call.</text>
  <rect class="card" x="444" y="412" width="332" height="124" rx="16"/>
  <text x="464" y="446" class="t h" font-size="21">Website and docs</text>
  <text x="464" y="474" class="mo bi" font-size="15">docs.ratchet.dualmindlab.tech</text>
  <text x="464" y="500" class="t2" font-size="16">Cloudflare Pages: static</text>
  <text x="464" y="522" class="t2" font-size="16">pages, no server code.</text>
  <rect class="zoneD" x="424" y="576" width="372" height="214" rx="24"/>
  <text x="448" y="608" class="mo m" font-size="14" letter-spacing="1.5">BUILT AND TESTED · NOT RUN LIVE</text>
