  <text x="1228" y="580" class="t h" font-size="21">Student endpoint</text>
  <rect class="pillG" x="1440" y="560" width="64" height="28" rx="14"/>
  <text x="1472.0" y="579" class="pillT mo" font-size="14" text-anchor="middle" letter-spacing="1.5" fill="#fff">GPU</text>
  <text x="1228" y="608" class="t2" font-size="16">vLLM + LoRA adapter.</text>
  <text x="1228" y="630" class="t2" font-size="16">GPU, billed while it runs.</text>
  <rect class="planS" x="856" y="676" width="312" height="100" rx="16"/>
  <text x="876" y="710" class="t h" font-size="21">Training job</text>
  <rect class="pillG" x="1088" y="690" width="64" height="28" rx="14"/>
  <text x="1120.0" y="709" class="pillT mo" font-size="14" text-anchor="middle" letter-spacing="1.5" fill="#fff">GPU</text>
  <text x="876" y="738" class="t2" font-size="16">Night School: LoRA fine-tune,</text>
  <text x="876" y="760" class="t2" font-size="16">then the exam. GPU, 2 h cap.</text>
  <rect class="planC" x="1208" y="676" width="312" height="100" rx="16"/>
  <text x="1228" y="710" class="t h" font-size="21">Object Storage bucket</text>
  <text x="1228" y="738" class="t2" font-size="16">Datasets and adapters,</text>
  <text x="1228" y="760" class="t2" font-size="16">mounted at /data.</text>
  <path class="ar" d="M778 304 H832" marker-end="url(#ah)"/>
  <text x="805" y="294" class="m" font-size="14" text-anchor="middle">calls</text>
  <path class="arD" d="M1162 544 V480" marker-end="url(#ab)"/>
  <path class="arD" d="M1170 596 H1204" marker-end="url(#ab)"/>
  <path class="arD" d="M1364 648 V672" marker-end="url(#ab)"/>
  <path class="arD" d="M1170 726 H1204" marker-end="url(#ab)"/>
  <rect class="card" x="64" y="818" width="26" height="20" rx="6"/>
  <text x="100" y="834" class="t h" font-size="16">Real today</text>
  <rect class="planS" x="236" y="818" width="26" height="20" rx="6"/>
  <text x="272" y="834" class="t h" font-size="16">Scripted and tested offline, ready to run</text>
  <rect class="pillG" x="760" y="816" width="50" height="24" rx="12"/>
  <text x="785" y="833" class="pillT mo" font-size="13" text-anchor="middle" letter-spacing="1" fill="#fff">GPU</text>
  <text x="822" y="834" class="t2" font-size="16">= training and the student endpoint. All else is CPU.</text>
  <text x="64" y="874" class="m" font-size="16">The public live demo has no student endpoint yet, so the teacher answers every request. make nebius-plan prints every step.</text>
