  <text x="104" y="452" class="t2" font-size="16">pytest, lint, reference runs.</text>
  <text x="104" y="474" class="t2" font-size="16">No network, no GPU.</text>
  <text x="104" y="496" class="t2" font-size="16">Same checks on GitHub.</text>
