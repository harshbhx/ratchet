  <text x="892" y="360" class="mo ri" font-size="14">Nemotron 3 Ultra</text>
  <rect class="inner" x="1090" y="304" width="190" height="80" rx="12"/>
  <text x="1106" y="334" class="t h" font-size="18">Hosted Nano</text>
  <text x="1106" y="360" class="t2" font-size="15">the random split</text>
  <rect class="inner" x="1304" y="304" width="190" height="80" rx="12"/>
  <text x="1320" y="334" class="t h" font-size="18">Judge</text>
  <text x="1320" y="360" class="t2" font-size="15">scores the answers</text>
  <rect class="grp" x="836" y="440" width="700" height="350" rx="24"/>
  <text x="860" y="472" class="mo m" font-size="14" letter-spacing="1.5">NEBIUS AI CLOUD · REAL, RUN BY HAND</text>
  <rect class="cardS" x="856" y="486" width="660" height="86" rx="16"/>
  <text x="876" y="516" class="t h" font-size="21">Serverless Job</text>
  <rect class="pillG" x="1436" y="498" width="64" height="28" rx="14"/>
  <text x="1468.0" y="517" class="pillT mo" font-size="14" text-anchor="middle" letter-spacing="1.5" fill="#fff">GPU</text>
  <text x="876" y="540" class="t2" font-size="16">The round-2 retrain, by hand, on 27 Oct 2026.</text>
  <text x="876" y="560" class="t2" font-size="16">One spot L40S. Checkpoints in the bucket.</text>
  <rect class="cardS" x="856" y="584" width="660" height="86" rx="16"/>
  <text x="876" y="614" class="t h" font-size="21">Serverless Endpoint</text>
  <rect class="pillG" x="1436" y="596" width="64" height="28" rx="14"/>
  <text x="1468.0" y="615" class="pillT mo" font-size="14" text-anchor="middle" letter-spacing="1.5" fill="#fff">GPU</text>
  <text x="876" y="638" class="t2" font-size="16">The student, served for measured speed tests on</text>
  <text x="876" y="658" class="t2" font-size="16">27 and 28 Oct 2026. Deleted afterwards.</text>
  <rect class="cardS" x="856" y="682" width="660" height="86" rx="16"/>
  <text x="876" y="712" class="t h" font-size="21">Object Storage</text>
  <text x="876" y="736" class="t2" font-size="16">The bucket: datasets, adapters and checkpoints,</text>
  <text x="876" y="756" class="t2" font-size="16">mounted at /data.</text>
  <path class="ar" d="M778 304 H832" marker-end="url(#ah)"/>
  <text x="805" y="294" class="m" font-size="14" text-anchor="middle">calls</text>
  <rect class="card" x="64" y="818" width="26" height="20" rx="6"/>
  <text x="100" y="834" class="t h" font-size="16">Real</text>
  <rect class="planC" x="170" y="818" width="26" height="20" rx="6"/>
  <text x="206" y="834" class="t h" font-size="16">Built and tested, not run live</text>
  <rect class="pillG" x="500" y="816" width="50" height="24" rx="12"/>
  <text x="525" y="833" class="pillT mo" font-size="13" text-anchor="middle" letter-spacing="1" fill="#fff">GPU</text>
  <text x="562" y="834" class="t2" font-size="16">= training and the student endpoint. All else is CPU.</text>
  <text x="64" y="874" class="m" font-size="16">The live site calls Token Factory for every model and has no student endpoint. The nightly loop has not run on live traffic.</text>
</svg>
