<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="wir-t wir-d" font-family="'Inter', system-ui, sans-serif">
  <title id="wir-t">Where everything runs</title>
  <desc id="wir-d">Where each part of Ratchet runs. Real on Nebius: Token Factory, which answers every model call on the live site (the teacher Nemotron 3 Ultra, the hosted Nano used for the random split, and the judge); an AI Cloud Serverless Job (the round-2 retraining, run by hand on 27 Oct 2026); an AI Cloud Serverless Endpoint (the student, served for measured speed tests on 27 and 28 Oct 2026, deleted afterwards); and an Object Storage bucket. Real elsewhere: the original adapters were trained on a borrowed GPU; Cloudflare runs the website, the docs and the live gateway, which has no student endpoint connected, so the teacher answers every call; development and tests run on the owner's laptop in mock mode. Built and tested, not run live: the nightly training loop (Night School) and the CPU VM kit. The nightly loop has not run on live traffic.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" class="mk" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" class="mkb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
