  <text x="464" y="736" class="t h" font-size="19">CPU VM kit</text>
  <text x="464" y="760" class="t2" font-size="15">Gateway, ledger, Caddy. Not run live.</text>
  <rect class="grp" x="836" y="176" width="700" height="244" rx="24"/>
  <text x="860" y="208" class="mo m" font-size="14" letter-spacing="1.5">NEBIUS TOKEN FACTORY · REAL</text>
