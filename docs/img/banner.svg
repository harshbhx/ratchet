<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Ratchet</title>
  <desc id="d">Ratchet: rent intelligence today, own it tomorrow. A gear with an owned blue half and a rented orange half.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <clipPath id="left"><rect x="-120" y="-120" width="120" height="240"/></clipPath>
    <clipPath id="right"><rect x="0" y="-120" width="120" height="240"/></clipPath>
    <g id="gear">
      <circle r="78"/>
      <rect x="-14" y="-108" width="28" height="36" rx="4"/>
      <rect x="-14" y="-108" width="28" height="36" rx="4" transform="rotate(30)"/>
      <rect x="-14" y="-108" width="28" height="36" rx="4" transform="rotate(60)"/>
      <rect x="-14" y="-108" width="28" height="36" rx="4" transform="rotate(90)"/>
      <rect x="-14" y="-108" width="28" height="36" rx="4" transform="rotate(120)"/>
      <rect x="-14" y="-108" width="28" height="36" rx="4" transform="rotate(150)"/>
      <rect x="-14" y="-108" width="28" height="36" rx="4" transform="rotate(180)"/>
      <rect x="-14" y="-108" width="28" height="36" rx="4" transform="rotate(210)"/>
      <rect x="-14" y="-108" width="28" height="36" rx="4" transform="rotate(240)"/>
      <rect x="-14" y="-108" width="28" height="36" rx="4" transform="rotate(270)"/>
      <rect x="-14" y="-108" width="28" height="36" rx="4" transform="rotate(300)"/>
      <rect x="-14" y="-108" width="28" height="36" rx="4" transform="rotate(330)"/>
    </g>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="none" stroke="#334155"/>
  <g transform="translate(200 160)">
    <g clip-path="url(#left)"><use href="#gear" fill="#3b82f6"/></g>
    <g clip-path="url(#right)"><use href="#gear" fill="#f97316"/></g>
    <circle r="34" fill="#0f172a"/>
    <path d="M 0 -34 L 22 -34 L 0 -60 Z" fill="#e2e8f0"/>
    <circle r="10" fill="#e2e8f0"/>
  </g>
  <text x="380" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="88" font-weight="700" fill="#f8fafc" letter-spacing="2">Ratchet</text>
  <text x="384" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#cbd5e1">Rent intelligence today. Own it tomorrow.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20">
    <rect x="384" y="236" width="256" height="34" rx="17" fill="#1e3a8a"/>
    <text x="512" y="259" text-anchor="middle" fill="#bfdbfe">student: owned adapter</text>
    <rect x="656" y="236" width="200" height="34" rx="17" fill="#7c2d12"/>
    <text x="756" y="259" text-anchor="middle" fill="#fed7aa">teacher: rented</text>
  </g>
</svg>
