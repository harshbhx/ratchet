<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="arch-t arch-d" font-family="'Inter', system-ui, sans-serif">
  <title id="arch-t">How Ratchet works</title>
  <desc id="arch-d">Architecture of Ratchet. Your app changes one line, the base URL, and sends requests to the OpenAI-compatible Ratchet gateway. Step 1, your app. Step 2, the student, Nemotron 3 Nano 4B with a LoRA adapter, answers first when a confidence gate (logprobs plus self-consistency, threshold calibrated per task) says it is sure. Step 3, on doubt the request goes to the teacher, Nemotron 3 Ultra on Nebius Token Factory, and its answer is served. Step 4, the provenance ledger stores every teacher answer after personal-data redaction with its teacher and license; only open, distillable teachers are allowed and closed models are refused in code; random audits measure how often the student is right. Step 5, Night School runs nightly: build the dataset with a train and held-out golden split, LoRA fine-tune, exam on the held-out golden set as the gate, and a signed bill of materials that travels with the adapter. Step 6, release gates: shadow, canary 10 percent, 50 percent, 100 percent, with automatic rollback if audited precision drops. Step 7, the released adapter becomes the student. Scout, the research agents, runs on the same gateway.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" class="mk" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" class="mkb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    .bg{fill:#fbfaf7}
    .card{fill:#ffffff;stroke:#d3cfc6;stroke-width:1.5}
    .cardS{fill:#e3eefc;stroke:#2a78d6;stroke-width:1.5}
    .cardT{fill:#fdeae1;stroke:#eb6834;stroke-width:1.5}
    .inner{fill:#ffffff;stroke:#d3cfc6;stroke-width:1.2}
    .chip{fill:#f7f6f2;stroke:#d3cfc6;stroke-width:1.2}
    .chipS{fill:#e3eefc;stroke:#2a78d6;stroke-width:1.5}
    .grp{fill:none;stroke:#b9b5aa;stroke-width:1.5;stroke-dasharray:7 7}
    .ar{fill:none;stroke:#77746d;stroke-width:2.5;stroke-linecap:round}
    .arb{fill:none;stroke:#2a78d6;stroke-width:3.5;stroke-linecap:round}
    .mk{stroke:#77746d}
    .mkb{stroke:#2a78d6}
    .t{fill:#121212}
    .t2{fill:#3d3c39}
    .m{fill:#64625d}
    .bi{fill:#1c5cab}
    .ri{fill:#b4461a}
    .badge{fill:#121212}
    .badgeT{fill:#fbfaf7}
    .badgeB{fill:#2a78d6}
    .dot{fill:#b9b5aa}
    .rail{stroke:#d3cfc6;stroke-width:2}
    .bad{stroke:#c92a2a;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .sw{fill:#2a78d6}
    .swT{fill:#eb6834}
    .h{font-weight:600}
    .mo{font-family:'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;font-weight:500}
    @media (prefers-color-scheme: dark){
    /*dark:start*/
    .bg{fill:#0b0b0c}
    .card{fill:#141416;stroke:#34343a}
    .cardS{fill:#192433;stroke:#3987e5}
    .cardT{fill:#331f19;stroke:#d95926}
    .inner{fill:#1a1a1d;stroke:#34343a}
    .chip{fill:#1a1a1d;stroke:#34343a}
    .chipS{fill:#192433;stroke:#3987e5}
    .grp{stroke:#4a4a52}
    .ar{stroke:#8f8e87}
    .arb{stroke:#3987e5}
    .mk{stroke:#8f8e87}
    .mkb{stroke:#3987e5}
    .t{fill:#f2f1ec}
    .t2{fill:#d6d5cf}
    .m{fill:#a4a39c}
    .bi{fill:#86b6ef}
    .ri{fill:#f29a72}
    .badge{fill:#f2f1ec}
    .badgeT{fill:#0b0b0c}
    .badgeB{fill:#3987e5}
    .dot{fill:#4a4a52}
    .rail{stroke:#34343a}
    .bad{stroke:#ff6b6b}
    .sw{fill:#3987e5}
    .swT{fill:#d95926}
    /*dark:end*/
    }
  </style>
  <rect class="bg" width="1600" height="900"/>

  <!-- header -->
  <text x="64" y="76" class="mo bi" font-size="16" letter-spacing="2.5">ARCHITECTURE</text>
  <text x="64" y="128" class="t h" font-size="42" letter-spacing="-0.8">The student answers. The teacher teaches. The gates decide.</text>

  <!-- gateway group -->
  <rect class="grp" x="348" y="196" width="786" height="290" rx="24"/>
  <text x="376" y="226" class="mo m" font-size="15" letter-spacing="1.5">RATCHET GATEWAY · OPENAI-COMPATIBLE</text>

  <!-- 1 app -->
  <rect class="card" x="64" y="236" width="220" height="230" rx="16"/>
  <circle class="badge" cx="92" cy="266" r="14"/><text x="92" y="272" class="badgeT h" font-size="16" text-anchor="middle">1</text>
  <text x="116" y="274" class="t h" font-size="24">Your app</text>
  <text x="84" y="322" class="t h" font-size="18">Change one line:</text>
  <text x="84" y="346" class="t2" font-size="18">the base URL.</text>
  <rect class="chip" x="84" y="364" width="170" height="36" rx="10"/>
  <text x="169" y="388" class="mo t" font-size="15.5" text-anchor="middle">base_url=…/v1</text>
  <text x="84" y="434" class="m" font-size="16">Same SDK, same code.</text>

  <!-- request / answer -->
  <path class="ar" d="M286 318 H344" marker-end="url(#ah)"/>
  <path class="ar" d="M346 388 H288" marker-end="url(#ah)"/>

  <!-- 2 student -->
  <rect class="cardS" x="372" y="236" width="340" height="230" rx="16"/>
  <circle class="badge" cx="400" cy="266" r="14"/><text x="400" y="272" class="badgeT h" font-size="16" text-anchor="middle">2</text>
  <text x="424" y="274" class="t h" font-size="24">Student first</text>
  <text x="396" y="314" class="mo t" font-size="16">Nemotron 3 Nano 4B</text>
  <text x="396" y="337" class="mo bi" font-size="16">+ LoRA adapter</text>
  <rect class="inner" x="392" y="356" width="300" height="90" rx="12"/>
  <text x="410" y="383" class="t h" font-size="18">Sure enough to answer?</text>
  <text x="410" y="408" class="m" font-size="16">logprobs + self-consistency,</text>
  <text x="410" y="430" class="m" font-size="16">threshold calibrated per task</text>

  <!-- unsure -->
  <text x="751" y="334" class="t2 h" font-size="16" text-anchor="middle">unsure</text>
  <path class="ar" d="M714 351 H786" marker-end="url(#ah)"/>

  <!-- 3 teacher -->
  <rect class="cardT" x="790" y="236" width="320" height="230" rx="16"/>
  <circle class="badge" cx="818" cy="266" r="14"/><text x="818" y="272" class="badgeT h" font-size="16" text-anchor="middle">3</text>
  <text x="842" y="274" class="t h" font-size="24">Teacher on doubt</text>
  <text x="814" y="314" class="mo t" font-size="16">Nemotron 3 Ultra</text>
  <text x="814" y="337" class="mo ri" font-size="16">on Nebius Token Factory</text>
  <text x="814" y="388" class="t2" font-size="18">Its answer is served,</text>
  <text x="814" y="414" class="t2" font-size="18">then logged in the ledger.</text>

  <path class="ar" d="M1112 351 H1194" marker-end="url(#ah)"/>

  <!-- 4 ledger -->
  <rect class="card" x="1198" y="236" width="338" height="230" rx="16"/>
  <circle class="badge" cx="1226" cy="266" r="14"/><text x="1226" y="272" class="badgeT h" font-size="16" text-anchor="middle">4</text>
  <text x="1250" y="274" class="t h" font-size="24">Provenance ledger</text>
  <circle class="dot" cx="1222" cy="303" r="4"/>
  <text x="1238" y="308" class="t2" font-size="16">Stored after personal-data</text>
  <text x="1238" y="330" class="t2" font-size="16">redaction, with teacher + license</text>
  <circle class="dot" cx="1222" cy="360" r="4"/>
  <text x="1238" y="365" class="t2" font-size="16">Open, distillable teachers only;</text>
  <text x="1238" y="387" class="t2" font-size="16">closed models refused in code</text>
  <circle class="dot" cx="1222" cy="417" r="4"/>
  <text x="1238" y="422" class="t2" font-size="16">Random audits measure how often</text>
  <text x="1238" y="444" class="t2" font-size="16">the student is really right</text>

  <!-- ledger -> night school -->
  <path class="ar" d="M1367 468 V576" marker-end="url(#ah)"/>
  <text x="1383" y="528" class="m" font-size="16">training data</text>

  <!-- 5 night school -->
  <rect class="card" x="960" y="580" width="576" height="236" rx="16"/>
  <circle class="badge" cx="988" cy="610" r="14"/><text x="988" y="616" class="badgeT h" font-size="16" text-anchor="middle">5</text>
  <text x="1012" y="618" class="t h" font-size="24">Night School</text>
  <rect class="chip" x="1416" y="594" width="96" height="30" rx="15"/>
  <text x="1464" y="614" class="mo m" font-size="14" text-anchor="middle" letter-spacing="1.5">NIGHTLY</text>
  <line class="rail" x1="990" y1="662" x2="990" y2="782"/>
  <circle class="dot" cx="990" cy="662" r="6"/><circle class="dot" cx="990" cy="702" r="6"/><circle class="dot" cx="990" cy="742" r="6"/><circle class="badgeB" cx="990" cy="782" r="6"/>
  <text x="1012" y="668" class="t h" font-size="18">Build dataset</text>
  <text x="1196" y="668" class="m" font-size="16">train + held-out golden split</text>
  <text x="1012" y="708" class="t h" font-size="18">LoRA fine-tune</text>
  <text x="1196" y="708" class="m" font-size="16">new adapter, train split only</text>
  <text x="1012" y="748" class="t h" font-size="18">Exam (the gate)</text>
  <text x="1196" y="748" class="m" font-size="16">held-out golden set</text>
  <text x="1012" y="788" class="t h" font-size="18">Signed BOM</text>
  <text x="1196" y="788" class="m" font-size="16">travels with the adapter</text>

  <path class="ar" d="M958 698 H874" marker-end="url(#ah)"/>

  <!-- 6 gates -->
  <rect class="card" x="372" y="580" width="500" height="236" rx="16"/>
  <circle class="badge" cx="400" cy="610" r="14"/><text x="400" y="616" class="badgeT h" font-size="16" text-anchor="middle">6</text>
  <text x="424" y="618" class="t h" font-size="24">Release gates</text>
  <rect class="chip" x="396" y="648" width="96" height="44" rx="12"/><text x="444" y="676" class="t h" font-size="17" text-anchor="middle">Shadow</text>
  <rect class="chip" x="520" y="648" width="128" height="44" rx="12"/><text x="584" y="676" class="t h" font-size="17" text-anchor="middle">Canary 10%</text>
  <rect class="chip" x="676" y="648" width="70" height="44" rx="12"/><text x="711" y="676" class="t h" font-size="17" text-anchor="middle">50%</text>
  <rect class="chipS" x="774" y="648" width="82" height="44" rx="12"/><text x="815" y="676" class="bi h" font-size="17" text-anchor="middle">100%</text>
  <path class="ar" d="M494 670 H516" marker-end="url(#ah)"/>
  <path class="ar" d="M650 670 H672" marker-end="url(#ah)"/>
  <path class="ar" d="M748 670 H770" marker-end="url(#ah)"/>
  <text x="396" y="738" class="t2" font-size="18">Ships only if it passes every gate.</text>
  <path class="bad" d="M418 773 H400 M406 767 L400 773 L406 779"/>
  <text x="430" y="779" class="t2" font-size="18">Automatic rollback if audited precision drops</text>

  <!-- 7 loop -->
  <path class="arb" d="M542 578 V470" marker-end="url(#ab)"/>
  <circle class="badgeB" cx="542" cy="524" r="14"/><text x="542" y="530" fill="#ffffff" class="h" font-size="16" text-anchor="middle">7</text>
  <text x="568" y="530" class="bi h" font-size="18">The released adapter becomes the student</text>

  <!-- legend -->
  <text x="64" y="606" class="mo m" font-size="14" letter-spacing="1.5">KEY</text>
  <rect class="sw" x="64" y="628" width="18" height="18" rx="5"/>
  <text x="94" y="636" class="t h" font-size="17">Student</text>
  <text x="94" y="658" class="m" font-size="16">an adapter you own</text>
  <rect class="swT" x="64" y="690" width="18" height="18" rx="5"/>
  <text x="94" y="698" class="t h" font-size="17">Teacher</text>
  <text x="94" y="720" class="m" font-size="16">open model, per token</text>
  <rect class="grp" x="64" y="752" width="264" height="64" rx="14"/>
  <text x="80" y="779" class="t h" font-size="16">Scout (research agents)</text>
  <text x="80" y="801" class="m" font-size="16">runs on the same gateway</text>

  <!-- footer -->
  <text x="64" y="866" class="m" font-size="16">Teacher calls run on Nebius Token Factory; adapter training ran on rented T4s. The diagram shows the design of the system.</text>
</svg>
