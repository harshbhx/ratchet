name: Build training image

# Builds deploy/Dockerfile.train and pushes ghcr.io/harshbhx/ratchet-train:<git sha> and :latest, the image a Night School
# Nebius Serverless Job runs (RATCHET_TRAIN_IMAGE). No secrets go into the image; the push uses the workflow's GITHUB_TOKEN.
on:
  push:
    branches: [ci/train-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.train
          push: true
          tags: |
            ghcr.io/harshbhx/ratchet-train:${{ github.sha }}
            ghcr.io/harshbhx/ratchet-train:latest
          labels: |
            org.opencontainers.image.source=https://github.com/harshbhx/ratchet
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest
        run: echo "ghcr.io/harshbhx/ratchet-train@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
