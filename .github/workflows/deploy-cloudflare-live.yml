# Deploys the LIVE demo to Cloudflare Containers. MANUAL ONLY: it never runs on a push, a merge or a schedule.
# First set the Worker's secrets (see deploy/cloudflare-live/README.md): NEBIUS_API_KEY and DEMO_API_KEY, optionally TAVILY_API_KEY.
# It needs the same two repository secrets as the simulation demo: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: deploy-cloudflare-live

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-live" to publish the live demo to live.ratchet.dualmindlab.tech'
        required: true
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy-live' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare-live
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build the image and deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
