# Deploys the LIVE demo to Cloudflare Containers. MANUAL ONLY: it never runs on a push, a merge or a schedule.
# First set the Worker's secrets (see deploy/cloudflare-live/README.md): NEBIUS_API_KEY and DEMO_API_KEY, optionally TAVILY_API_KEY.
# It needs the same two repository secrets as the simulation demo: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: deploy-cloudflare-live

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-live" to publish the live demo to live.ratchet.dualmindlab.tech'
        required: true
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy-live' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare-live
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build the image and deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    # Final check from outside once the deploy is done: pages, /healthz mode, /readyz and /scout/status (never runs Scout,
    # never sends a key or a completion). A waking-up demo gets about two minutes of retries to answer.
    needs: deploy
    if: ${{ inputs.confirm == 'deploy-live' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check https://live.ratchet.dualmindlab.tech
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python scripts/demo_check.py https://live.ratchet.dualmindlab.tech --mode live --timeout 20; then exit 0; fi
            echo "attempt $attempt failed; waiting 20 s for the site to wake up"
            sleep 20
          done
          echo "the site did not pass its smoke check" >&2
          exit 1
