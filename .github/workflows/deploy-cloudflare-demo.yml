# Deploys the demo to Cloudflare Containers. MANUAL ONLY: it never runs on a push, a merge or a schedule.
# Run it from the Actions tab (Run workflow) and type "deploy" in the box. It needs two repository secrets, added in
# Settings > Secrets and variables > Actions (never in chat, never in a file): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: deploy-cloudflare-demo

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to publish the demo to demo-cf.ratchet.dualmindlab.tech'
        required: true
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build the image and deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
