[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratchet-distill"
version = "0.5.0"
description = "License-clean distillation on open models: an OpenAI-compatible gateway that turns your traffic into a Nemotron adapter you own (LoRA on NVIDIA's open Nano base)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2", "anyio>=3.7"]

[project.optional-dependencies]
# The training image's versions (deploy/train-versions.txt; torch and the Mamba kernels need its CUDA build steps). Python 3.11+.
train = ["trl==1.16.0", "transformers==4.57.6", "peft==0.21.2", "accelerate==1.15.0", "datasets==4.8.5"]
# Ed25519 signatures on each adapter's bill of materials (RATCHET_BOM_SIGNING_KEY).
sign = ["cryptography>=42"]
# A RATCHET_TASKS_FILE written in YAML (JSON needs nothing extra).
yaml = ["PyYAML>=6"]
# openai: tests/test_openai_compat.py drives the real SDK against the gateway in-process (tests/sdk_bridge.py).
# jinja2: tests/test_nightschool.py renders the vendored Nemotron chat template as transformers does (FR-8.42).
dev = ["ruff", "pytest>=8", "pytest-cov>=5", "cryptography>=42", "openai>=1.40", "PyYAML>=6", "jinja2>=3.1"]

[project.urls]
Homepage = "https://ratchet.dualmindlab.tech"
Documentation = "https://docs.ratchet.dualmindlab.tech"
Repository = "https://github.com/harshbhx/ratchet"
Issues = "https://github.com/harshbhx/ratchet/issues"

[tool.setuptools.packages.find]
include = ["ratchet*", "sim*"]

[tool.setuptools.package-data]
ratchet = ["dashboard.html", "web/*.html", "web/dist/*", "web/dist/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A misspelled marker is an error, so a requirement marker can never be silently ignored.
addopts = "--strict-markers"
# A test that has not finished after 15 minutes is stuck (the slowest takes 14 s bare, a minute or two on a CI runner under
# coverage): dump every thread's stack into the log, so a hang is diagnosed from it, not from a job that ends at its limit.
faulthandler_timeout = 900
markers = [
    "req(*ids): requirement ids this test proves",
    "slow: a long Monte Carlo run; skipped unless pytest is given --runslow (CI passes it)",
]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["evidence/toolcall/scorers", "evidence/student-endpoint-nebius/scripts"]  # byte-for-byte copies of the exams' own scorers and of the scripts as run (hashed in MANIFEST.json)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Body()/Header() defaults are the documented pattern

[tool.ruff.lint.per-file-ignores]
"sim/tickets.py" = ["E501"]  # template sentences read better on one line
"sim/research.py" = ["E501"]  # facts and templates read better on one line
